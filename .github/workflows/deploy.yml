name: Deploy Corpus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Expand initial source import
        shell: bash
        run: |
          if [ ! -f app/page.tsx ]; then
            unzip -oq Corpus_Code.zip
            unzip -oq Corpus_Models_A.zip
            unzip -oq Corpus_Models_B.zip
            git rm Corpus_Code.zip Corpus_Models_A.zip Corpus_Models_B.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand complete Corpus app source and model assets"
            git push origin HEAD:main
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - name: Build static website
        env:
          NEXT_PUBLIC_BASE_PATH: /Corpus
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx --yes pnpm@11.25.0 build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
